[project]
name = "skypulse"
version = "2.0.0"
description = "SkyPulse weather intelligence API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
