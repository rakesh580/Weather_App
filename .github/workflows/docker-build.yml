name: Deploy

# Builds the production image and deploys it to EC2. Runs only for the stable branch
# after CI has passed; the v2 line is validated by ci.yml on every push.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    name: Build & push image
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/weather-app:latest
            ${{ secrets.DOCKER_USERNAME }}/weather-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 and roll the container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if ! command -v docker >/dev/null; then
              sudo apt-get update -y && sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/weather-app:latest
            sudo docker stop weather-app || true
            sudo docker rm weather-app || true
            # The image listens on 80 inside the container (see Dockerfile).
            sudo docker run -d --name weather-app --restart unless-stopped \
              -p 80:80 \
              -e OPENWEATHER_API_KEY='${{ secrets.OPENWEATHER_API_KEY }}' \
              -e GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
              -e ORS_API_KEY='${{ secrets.ORS_API_KEY }}' \
              -e ALLOWED_ORIGINS='${{ secrets.ALLOWED_ORIGINS }}' \
              ${{ secrets.DOCKER_USERNAME }}/weather-app:latest
            sudo docker image prune -f
            sleep 5 && curl -fsS http://localhost/api/health
